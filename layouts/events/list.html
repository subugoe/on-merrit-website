{{ define "main" }}
<main class="grid-x grid-container">
    <div class="cell medium-10 medium-offset-1 large-8 large-offset-2">
        <h1 class="margin-top-3">{{ .Title }}</h1>
        {{ .Content }}
        {{ range where site.RegularPages "Params.categories" "intersect" (slice "events") }}
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <p>{{ .Date.Format "2006-01-02" }}</p>
        <p>{{ .Summary }}<br>
            <a href="{{ .RelPermalink }}">{{ index hugo.Data.lang "more" }}</a>
        </p>
        {{ end }}
    </div>
</main>
{{ end }}
