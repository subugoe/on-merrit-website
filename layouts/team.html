{{ define "main" }}
<main class="grid-x grid-container">
  <div class="cell medium-10 medium-offset-1 large-8 large-offset-2">
    <h1 class="margin-top-2">{{ .Title }}</h1>
    {{ .Content }}
  </div>
  <div class="grid-x grid-container grid-margin-x">
    {{ if eq .Params.members "adv-board" }}
      {{ partial "board-members.html" . }}
    {{ else }}
      {{ partial "team-members.html" . }}
    {{ end }}
  </div>
</main>
{{ end }}
