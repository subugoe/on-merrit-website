{{ range index hugo.Data "adv-board" }}
{{ $member := . }}
{{ $member := . }}
<div class="cell margin-bottom-2 margin-top-2 medium-6 large-4">
  <div class="team_member">
    {{ $img := replace (lower .name) " " "_" }}
    <img src="{{ printf "img/advisory-board/image_%s.jpg" $img | relURL }}" class="team_member_img" aria-hidden="true">
    <br>
    <strong>{{ .name }}</strong><br>
    {{ .institution }}
    {{ range .urls.en }}
    <a href="{{ . }}" title="Open hompage of {{ $member.name }}">
      <img src="{{ "img/icons/new-window.svg" | relURL }}" style="margin-top: -5px; margin-left: 5px;" aria-hidden="true">
      <span class="show-for-sr">Open hompage of {{ $member.name }}</span>
    </a>
    {{ end }}
    <p style="text-align:justify; margin-top: 10px; font-size: 90%;">{{ .text }}</p>
  </div>
</div>
{{ end }}
