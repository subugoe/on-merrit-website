{{ range hugo.Data.people }}
{{ $member := . }}
<div class="cell margin-bottom-2 margin-top-2 medium-4 large-3">
  <div class="team_member">
    {{ $img := replace (lower .name) " " "_" }}
    <img src="{{ printf "img/bilder_team/image_%s.jpg" $img | relURL }}" class="team_member_img" aria-hidden="true">
    <br>
    {{ .name }}<br>
    <a href="mailto:{{ .mail }}" title="Mail to {{ .name }}">
      <img src="{{ "img/icons/email.svg" | relURL }}" aria-hidden="true">
      <span class="show-for-sr">Mail to {{ .name }}</span>
    </a>&nbsp;
    {{ range .urls.en }}
    <a href="{{ . }}" title="Open hompage of {{ $member.name }}">
      <img src="{{ "img/icons/new-window.svg" | relURL }}" style="margin-top: -5px;" aria-hidden="true">
      <span class="show-for-sr">Open hompage of {{ $member.name }}</span>
    </a>
    {{ end }}
    <p>{{ .text }}</p>
  </div>
</div>
{{ end }}
